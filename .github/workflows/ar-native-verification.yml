name: AR native tests and visual evidence

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: macos-26
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and verify system shortcut
        run: |
          python3 scripts/build-system-shortcut.py
          python3 scripts/check-system-shortcut.py
      - name: Select iPhone simulator
        id: simulator
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import json, os, subprocess
          data=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          devices=[d for group in data['devices'].values() for d in group if d.get('isAvailable') and 'iPhone' in d['name']]
          if not devices: raise SystemExit('No available iPhone simulator')
          with open(os.environ['GITHUB_OUTPUT'],'a') as output: output.write('udid='+devices[0]['udid']+'\n')
          PY
      - name: Run complete XCTest suite
        run: |
          set -o pipefail
          xcodebuild -project JarvisPhone.xcodeproj -scheme JarvisPhone \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -parallel-testing-enabled NO -derivedDataPath .build \
            -resultBundlePath TestResults.xcresult CODE_SIGNING_ALLOWED=NO test 2>&1 | tee xcodebuild.log
      - name: Export actual test attachments
        if: always()
        run: xcrun xcresulttool export attachments --path TestResults.xcresult --output-path TestAttachments
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jarvis-ar-verification
          retention-days: 7
          path: |
            xcodebuild.log
            TestAttachments
