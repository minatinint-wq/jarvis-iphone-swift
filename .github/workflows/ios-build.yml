name: iPhone build and tests

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'macOS runner for native verification'
        type: choice
        options: [macos-15, macos-26]
        default: macos-15
      verification_only:
        description: 'Run complete XCTest and export evidence; device package is validated by xtool workflow'
        type: boolean
        default: false
      only_testing:
        description: 'Optional XCTest identifiers, one per line'
        type: string
        default: ''
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: jarvis-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  simulator:
    runs-on: ${{ inputs.runner || 'macos-15' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Prepare and sign local iPhone controls
        shell: bash
        run: |
          python3 scripts/build-system-shortcut.py
          python3 scripts/check-system-shortcut.py
          aea decrypt -i "JarvisPhone/Resources/JARVIS Sistema.shortcut" -o "$RUNNER_TEMP/system.aa" -sign-pub Shortcuts/system-signing-public.hex
          mkdir -p "$RUNNER_TEMP/system-decoded"
          aa extract -i "$RUNNER_TEMP/system.aa" -d "$RUNNER_TEMP/system-decoded"
          python3 scripts/check-system-shortcut.py "$RUNNER_TEMP/system-decoded/Shortcut.wflow"
      - name: Xcode and simulator
        id: simulator
        shell: bash
        run: |
          xcodebuild -version
          python3 - <<'PY'
          import json, os, subprocess
          data = json.loads(subprocess.check_output(['xcrun', 'simctl', 'list', 'devices', 'available', '-j']))
          devices = [device for group in data['devices'].values() for device in group
                     if device.get('isAvailable') and 'iPhone' in device['name']]
          if not devices:
              raise SystemExit('No available iPhone simulator')
          device = devices[0]
          print('Simulator:', device['name'], device['udid'])
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('udid=' + device['udid'] + '\n')
          PY
      - name: Compile and run XCTest
        shell: bash
        env:
          TEST_FILTER: ${{ inputs.only_testing }}
        run: |
          set -o pipefail
          xcrun simctl boot '${{ steps.simulator.outputs.udid }}' 2>/dev/null || true
          args=()
          while IFS= read -r test; do
            if [ -n "$test" ]; then args+=("-only-testing:$test"); fi
          done <<< "$TEST_FILTER"
          xcodebuild -project JarvisPhone.xcodeproj -scheme JarvisPhone \
            ONLY_ACTIVE_ARCH=YES \
            -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}' \
            -parallel-testing-enabled NO \
            -derivedDataPath .build -resultBundlePath TestResults.xcresult \
            CODE_SIGNING_ALLOWED=NO "${args[@]}" test 2>&1 | tee xcodebuild.log
      - name: Preserve raw GPU test frames
        if: always()
        run: |
          find "$HOME/Library/Developer/CoreSimulator/Devices/${{ steps.simulator.outputs.udid }}/data/Containers/Data/Application" -name 'JARVIS-VRBOX-GPU*.png' -exec cp '{}' . \;
      - name: Export test screenshots
        if: always()
        run: xcrun xcresulttool export attachments --path TestResults.xcresult --output-path TestAttachments
      - name: Launch app and capture screenshot
        if: ${{ !inputs.verification_only }}
        shell: bash
        run: |
          xcrun simctl bootstatus '${{ steps.simulator.outputs.udid }}' -b
          xcrun simctl install '${{ steps.simulator.outputs.udid }}' .build/Build/Products/Debug-iphonesimulator/JarvisPhone.app
          xcrun simctl launch '${{ steps.simulator.outputs.udid }}' com.jarvisxlv.iphone
          sleep 3
          xcrun simctl openurl '${{ steps.simulator.outputs.udid }}' jarvisiphone://automacoes
          sleep 2
          xcrun simctl io '${{ steps.simulator.outputs.udid }}' screenshot JARVIS-IPHONE-SIMULADOR.png
          ditto -c -k --sequesterRsrc --keepParent .build/Build/Products/Debug-iphonesimulator/JarvisPhone.app JarvisPhone-Simulator.zip
      - name: Compile for physical iPhone without signing
        if: ${{ !inputs.verification_only }}
        shell: bash
        run: |
          set -o pipefail
          xcodebuild -project JarvisPhone.xcodeproj -scheme JarvisPhone \
            -configuration Release -destination 'generic/platform=iOS' \
            -derivedDataPath .device-build CODE_SIGNING_ALLOWED=NO build \
            2>&1 | tee device-build.log
          mkdir -p DevicePackage/Payload
          ditto .device-build/Build/Products/Release-iphoneos/JarvisPhone.app DevicePackage/Payload/JarvisPhone.app
          cd DevicePackage
          ditto -c -k --keepParent Payload ../JARVIS-iPhone-SEM-ASSINATURA.ipa
      - name: Save build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jarvis-iphone-build
          retention-days: 7
          if-no-files-found: warn
          path: |
            JarvisPhone/Resources/JARVIS Sistema.shortcut
            xcodebuild.log
            TestResults.xcresult
            TestAttachments
            JARVIS-VRBOX-GPU*.png
            JARVIS-IPHONE-SIMULADOR.png
            JarvisPhone-Simulator.zip
            device-build.log
            JARVIS-iPhone-SEM-ASSINATURA.ipa
