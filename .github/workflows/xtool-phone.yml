name: JARVIS iPhone via xtool

on:

  push:

    branches: ['build/xtool-iphone-20261115']

  workflow_dispatch:
    inputs:
      forest_probe:
        description: Verify forest geometry and typecheck native sources
        type: boolean
        default: false
      video_probe:
        description: Verify actual production video presentation on iOS
        type: boolean
        default: false
      gpu_probe:
        description: 'Verify the production compositor directly on Metal without a simulator'
        type: boolean
        default: false
      notification_shortcut:
        description: Sign only the native notification shortcut
        type: boolean
        default: false
      notification_bundle:
        description: Installed application identifier for the native notification action
        type: string
        default: com.jarvisxlv.iphone
      ui_only:
        description: 'Compilar ajuste visual apÃ³s validaÃ§Ã£o completa do nÃºcleo'
        type: boolean
        default: false

permissions:

  contents: read

jobs:
  forest:
    if: ${{ inputs.forest_probe }}
    runs-on: macos-26
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Verify forest geometry and hand input
        run: |
          swiftc JarvisPhone/Core/RoomForestMath.swift scripts/probe-forest-math.swift -o /tmp/forest-probe
          /tmp/forest-probe
      - name: Typecheck the native app
        run: |
          set -o pipefail
          find JarvisPhone -name '*.swift' -print0 | xargs -0 xcrun swiftc -typecheck -parse-as-library -swift-version 5 -D DEBUG -module-name JarvisPhone -sdk "$(xcrun --sdk iphonesimulator --show-sdk-path)" -target "$(uname -m)-apple-ios17.0-simulator" 2>&1 | tee forest-typecheck.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: forest-swift-verification
          path: forest-typecheck.log
  video:
    if: ${{ inputs.video_probe }}
    runs-on: macos-26
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - name: Boot simulator and compile the production view probe
        run: |
          python3 - <<'PY'
          import json, subprocess
          from pathlib import Path
          devices=json.loads(subprocess.check_output(['xcrun','simctl','list','devices','available','-j']))
          device=next(d for group in devices['devices'].values() for d in group if d.get('isAvailable') and 'iPhone' in d['name'])
          Path('/tmp/video-udid').write_text(device['udid'])
          subprocess.Popen(['xcrun','simctl','boot',device['udid']])
          PY
          python3 scripts/video-presentation-probe.py
      - name: Display both physical video layers and capture the actual screen
        run: |
          set -eu
          udid=$(cat /tmp/video-udid)
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" /tmp/JarvisVideoProbe.app
          xcrun simctl launch "$udid" com.jarvisxlv.video-probe
          data=$(xcrun simctl get_app_container "$udid" com.jarvisxlv.video-probe data)
          for i in $(seq 1 40); do
            if [ -f "$data/Documents/result.json" ]; then break; fi
            sleep 1
          done
          mkdir evidence
          cp "$data/Documents/"*.json "$data/Documents/"*.png evidence/
          xcrun simctl io "$udid" screenshot evidence/Holo-physical-two-eyes.png
          python3 - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path('evidence/result.json').read_text())
          print(result)
          assert result['passed'] and result['same_displayed_pixels'] and result['hosts_clipped']
          print('PRODUCTION_VIDEO_TWO_EYES_PASS')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-Production-Video
          path: evidence/


  gpu:
    if: ${{ inputs.gpu_probe && !inputs.video_probe }}
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Render and inspect actual GPU output
        timeout-minutes: 3
        run: |
          set -o pipefail
          python3 scripts/headset-gpu-probe.py
          swiftc -parse-as-library -swift-version 5 HeadsetGPUProbe.swift -o /tmp/headset-gpu-probe
          /tmp/headset-gpu-probe 2>&1 | tee gpu-probe.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: JARVIS-VRBox-GPU
          path: |
            gpu-probe.log
            JARVIS-VRBOX-GPU*.png

  iphone:

    if: ${{ !inputs.gpu_probe && !inputs.video_probe && !inputs.notification_shortcut && !inputs.forest_probe }}

    runs-on: macos-26

    timeout-minutes: 25

    steps:

      - uses: actions/checkout@v4

      - name: Prepare and sign local iPhone controls
        shell: bash
        run: |
          python3 scripts/build-system-shortcut.py
          python3 scripts/check-system-shortcut.py
          aea decrypt -i "JarvisPhone/Resources/JARVIS Sistema.shortcut" -o "$RUNNER_TEMP/system.aa" -sign-pub Shortcuts/system-signing-public.hex
          mkdir -p "$RUNNER_TEMP/system-decoded"
          aa extract -i "$RUNNER_TEMP/system.aa" -d "$RUNNER_TEMP/system-decoded"
          python3 scripts/check-system-shortcut.py "$RUNNER_TEMP/system-decoded/Shortcut.wflow"
      - name: SDK e xtool oficial

        run: |

          set -eu

          xcodebuild -version

          xcrun --sdk iphoneos --show-sdk-version

          curl -fLsS --retry 2 https://github.com/xtool-org/xtool/releases/download/1.24.0/xtool.app.zip -o "$RUNNER_TEMP/xtool.zip"

          ditto -xk "$RUNNER_TEMP/xtool.zip" "$RUNNER_TEMP/xtool-bin"

          echo "$RUNNER_TEMP/xtool-bin/xtool.app/Contents/Resources/bin" >> "$GITHUB_PATH"

      - name: Testar Ã¡udio e protocolo da cÃ¢mera

        run: swiftc JarvisPhone/Core/PhoneMedia.swift scripts/test-phone-media.swift -o "$RUNNER_TEMP/media-test" && "$RUNNER_TEMP/media-test"

      - name: Medir saÃ­da do sampler da Apple por instrumento

        run: swift scripts/probe-bank.swift JarvisPhone/Resources/JarvisInstruments.sf2

      - name: Validar mÃ£os reais, pinÃ§a e continuidade de rastreamento
        run: |
          mkdir -p /tmp/hand-fixtures
          for image in pointing_up thumb_up cats_and_dogs; do
            curl -fLsS --retry 2 "https://storage.googleapis.com/mediapipe-assets/$image.jpg" -o "/tmp/hand-fixtures/$image.jpg"
          done
          swiftc JarvisPhone/Core/SpatialGesture.swift JarvisPhone/Core/HandPoseInput.swift scripts/probe-hand-control.swift -o /tmp/hand-probe
          /tmp/hand-probe /tmp/hand-fixtures

      - name: Validar limpeza e preservaÃ§Ã£o do mapa Ãºnico
        run: |
          swiftc JarvisPhone/Core/SpatialSingleMap.swift scripts/probe-single-map.swift -o /tmp/single-map-probe
          /tmp/single-map-probe

      - name: Compilar IPA arm64 com xtool

        run: |

          set -eo pipefail

          xtool dev build --ipa 2>&1 | tee "$RUNNER_TEMP/xtool-build.log"

          mkdir -p entrega

          p=$(find . -name '*.ipa' -not -path './entrega/*' | head -1)

          test -f "$p"

          cp "$p" entrega/JarvisPhone.ipa

          python3 scripts/check-ipa.py entrega/JarvisPhone.ipa

      - name: Empacotar aplicativo com a extensÃ£o da tela bloqueada e metadados do Atalhos

        run: |

          set -eo pipefail

          xcodebuild -quiet -project JarvisPhone.xcodeproj -scheme JarvisPhone -configuration Release -destination "generic/platform=iOS" -derivedDataPath "$RUNNER_TEMP/phone-device" CODE_SIGNING_ALLOWED=NO COMPRESS_PNG_FILES=NO build

          mkdir -p "$RUNNER_TEMP/full/Payload"

          ditto "$RUNNER_TEMP/phone-device/Build/Products/Release-iphoneos/JarvisPhone.app" "$RUNNER_TEMP/full/Payload/JarvisPhone.app"

          (cd "$RUNNER_TEMP/full" && ditto -c -k --keepParent Payload "$RUNNER_TEMP/full-iphone.ipa")

          cp "$RUNNER_TEMP/full-iphone.ipa" entrega/JarvisPhone.ipa

          python3 scripts/check-ipa.py entrega/JarvisPhone.ipa --with-extension

      - uses: actions/upload-artifact@v4

        with:

          name: JARVIS-iPhone-xtool

          path: entrega/JarvisPhone.ipa

          if-no-files-found: error

      - name: Abrir a tela inicial no simulador
        if: ${{ !inputs.ui_only }}

        run: |

          set -e

          runtime=$(xcrun simctl list runtimes -j | python3 -c 'import sys,json;print(next(x["identifier"] for x in json.load(sys.stdin)["runtimes"] if x["isAvailable"] and "SimRuntime.iOS-" in x["identifier"]))')

          id=$(xcrun simctl create 'Jarvis iPhone 13 Pro Max' com.apple.CoreSimulator.SimDeviceType.iPhone-13-Pro-Max "$runtime")

          xcrun simctl boot "$id"

          xcodebuild -parallel-testing-enabled NO -project JarvisPhone.xcodeproj -scheme JarvisPhone -destination "id=$id" -derivedDataPath "$RUNNER_TEMP/jarvis-derived" -resultBundlePath "$RUNNER_TEMP/wall-tests.xcresult" CODE_SIGNING_ALLOWED=NO test

          xcrun simctl install "$id" "$RUNNER_TEMP/jarvis-derived/Build/Products/Debug-iphonesimulator/JarvisPhone.app"

          xcrun simctl launch "$id" com.jarvisxlv.iphone

          xcrun simctl openurl "$id" jarvisiphone://rosto

          sleep 3

          xcrun simctl io "$id" screenshot "$RUNNER_TEMP/assistant.png"

      - name: Exportar evidÃªncia visual dos materiais AR
        if: always() && !inputs.ui_only
        run: |
          if [ -d "$RUNNER_TEMP/wall-tests.xcresult" ]; then
            xcrun xcresulttool export attachments --path "$RUNNER_TEMP/wall-tests.xcresult" --output-path "$RUNNER_TEMP/wall-attachments"
          fi

      - uses: actions/upload-artifact@v4

        if: always() && !inputs.ui_only

        with:

          name: JARVIS-xtool-evidencia

          path: |

            ${{ runner.temp }}/assistant.png

            ${{ runner.temp }}/xtool-build.log
            ${{ runner.temp }}/wall-attachments


  notification:
    if: ${{ inputs.notification_shortcut }}
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the reviewed Apple-signed native shortcut
        run: |
          python3 scripts/check-pc-notification-shortcut.py
          aea decrypt -i "Shortcuts/JARVIS+Notificacoes-PC.shortcut" -o "$RUNNER_TEMP/notification.aa" -sign-pub Shortcuts/notification-pc-signing-public.hex
          mkdir -p "$RUNNER_TEMP/notification-decoded"
          aa extract -i "$RUNNER_TEMP/notification.aa" -d "$RUNNER_TEMP/notification-decoded"
          python3 scripts/check-pc-notification-shortcut.py "$RUNNER_TEMP/notification-decoded/Shortcut.wflow"
          cp "Shortcuts/JARVIS+Notificacoes-PC.shortcut" "$RUNNER_TEMP/JARVIS+Notificacoes.shortcut"
          cp "Shortcuts/JARVIS+Notificacoes-PC.plist" "$RUNNER_TEMP/JARVIS+Notificacoes.plist"
          cp "Shortcuts/notification-pc-signature.json" "$RUNNER_TEMP/notification-shortcut-verification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Notificacoes-PC
          path: |
            ${{ runner.temp }}/JARVIS+Notificacoes.shortcut
            ${{ runner.temp }}/JARVIS+Notificacoes.plist
            ${{ runner.temp }}/notification-shortcut-verification.json
