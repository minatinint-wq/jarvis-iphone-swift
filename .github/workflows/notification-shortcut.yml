name: Sign native JARVIS notification shortcut
on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: Installed JARVIS application identifier
        type: string
        required: true
permissions:
  contents: read
jobs:
  sign:
    runs-on: macos-26
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Verify the reviewed Apple-signed native shortcut
        run: |
          python3 scripts/check-notification-shortcut.py
          aea decrypt -i "Shortcuts/JARVIS+Notificacoes-Nativo.shortcut" -o "$RUNNER_TEMP/notification.aa" -sign-pub Shortcuts/notification-signing-public.hex
          mkdir -p "$RUNNER_TEMP/notification-decoded"
          aa extract -i "$RUNNER_TEMP/notification.aa" -d "$RUNNER_TEMP/notification-decoded"
          python3 scripts/check-notification-shortcut.py "$RUNNER_TEMP/notification-decoded/Shortcut.wflow"
          cp "Shortcuts/JARVIS+Notificacoes-Nativo.shortcut" "$RUNNER_TEMP/JARVIS+Notificacoes.shortcut"
          cp "Shortcuts/JARVIS+Notificacoes-Nativo.plist" "$RUNNER_TEMP/JARVIS+Notificacoes.plist"
          cp "Shortcuts/notification-native-signature.json" "$RUNNER_TEMP/notification-shortcut-verification.json"
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Notificacoes-Nativo
          path: |
            ${{ runner.temp }}/JARVIS+Notificacoes.shortcut
            ${{ runner.temp }}/JARVIS+Notificacoes.plist
            ${{ runner.temp }}/notification-shortcut-verification.json
